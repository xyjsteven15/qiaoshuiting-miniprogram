<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>桥水汀 · 店长控制台</title>
<style>
  :root {
    --paper: #EFF0EC;
    --card: #FFFFFF;
    --ink: #262A24;
    --ink-soft: #5C6156;
    --muted: #9CA093;
    --line: #DBDBD2;
    --red: #9E3B32;
    --teal: #4E7672;
    --gold: #8A6D3F;
    --ok-bg: #E4EDE6;
    --rose-bg: #EEF1ED;
    --serif: "Songti SC", "STSong", "SimSun", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  .serif { font-family: var(--serif); }

  /* ===== 登录页 ===== */
  #login {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 14px;
  }
  #login .wordmark { font-size: 40px; letter-spacing: 14px; text-indent: 14px; color: var(--ink); font-weight: 600; }
  #login .en { font-size: 10px; letter-spacing: 3px; color: var(--muted); margin: 2px 0 8px; }
  #login h1 { font-size: 20px; letter-spacing: 4px; font-weight: 600; }
  #login .sub { font-size: 12px; color: var(--muted); letter-spacing: 2px; margin-bottom: 12px; }
  #login input {
    width: 260px;
    padding: 14px 16px;
    font-size: 16px;
    text-align: center;
    letter-spacing: 2px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    outline: none;
  }
  #login input:focus { border-color: var(--ink); }
  #login button {
    width: 260px;
    padding: 14px 0;
    font-size: 16px;
    letter-spacing: 6px;
    color: #fff;
    background: var(--ink);
    border: none;
    border-radius: 8px;
  }
  #login .err { font-size: 13px; color: var(--red); min-height: 18px; }

  /* ===== 控制台 ===== */
  #dash { display: none; max-width: 640px; margin: 0 auto; padding: 0 16px 60px; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper);
    padding: 14px 0 10px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  .topbar .title { font-size: 18px; font-weight: 600; letter-spacing: 2px; }
  .topbar .spacer { flex: 1; }
  .icon-btn {
    font-size: 13px; color: var(--ink-soft);
    border: 1px solid var(--line); background: var(--card);
    border-radius: 6px; padding: 6px 12px;
  }
  .stats { display: flex; gap: 10px; padding: 14px 0; }
  .stat {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 4px; text-align: center;
  }
  .stat .n { font-size: 22px; font-weight: 700; font-family: var(--serif); }
  .stat .t { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat.pending .n { color: var(--gold); }
  .stat.confirmed .n { color: var(--teal); }
  .stat.cancelled .n { color: var(--muted); }

  .filters { display: flex; gap: 8px; padding-bottom: 12px; overflow-x: auto; }
  .chip {
    flex: none; font-size: 13px; padding: 6px 14px;
    border: 1px solid var(--line); border-radius: 999px;
    background: var(--card); color: var(--ink-soft);
  }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .day-group { margin-top: 14px; font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px; margin-top: 8px;
  }
  .card.dim { opacity: .55; }
  .row1 { display: flex; align-items: center; gap: 8px; }
  .code { font-weight: 600; font-size: 15px; }
  .st {
    margin-left: auto; font-size: 11px; border-radius: 4px; padding: 3px 10px;
  }
  .st.pending { color: var(--gold); background: #F4EEE1; }
  .st.confirmed { color: var(--teal); background: var(--ok-bg); }
  .st.seated { color: #fff; background: var(--teal); }
  .st.no_show, .st.cancelled { color: var(--muted); background: var(--rose-bg); }
  .meta { margin-top: 8px; font-size: 14px; line-height: 1.9; }
  .meta .who { color: var(--ink-soft); }
  .meta a { color: var(--teal); text-decoration: none; font-weight: 600; }
  .note { margin-top: 6px; font-size: 13px; color: var(--gold); background: #FAF7EF; border-radius: 6px; padding: 6px 10px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .act {
    flex: 1; text-align: center; font-size: 14px; padding: 9px 0;
    border-radius: 8px; border: 1px solid var(--ink); color: var(--ink); background: #fff;
  }
  .act.primary { background: var(--ink); color: #fff; }
  .act.danger { border-color: var(--red); color: var(--red); }
  .act:disabled { opacity: .4; }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 48px 0; }
  .loading { text-align: center; color: var(--muted); font-size: 14px; padding: 32px 0; }
  .foot { text-align: center; font-size: 11px; color: var(--muted); margin-top: 32px; letter-spacing: 1px; }
</style>
</head>
<body>

<!-- ===== 登录 ===== -->
<div id="login">
  <div class="wordmark serif">桥水汀</div>
  <div class="en">QIAO SHUI TING</div>
  <h1 class="serif">店长控制台</h1>
  <div class="sub">桥水汀 · 预订管理</div>
  <input id="pass" type="password" placeholder="请输入管理口令" autocomplete="off" />
  <button id="enter">进 入</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- ===== 控制台 ===== -->
<div id="dash">
  <div class="topbar">
    <div class="title serif">预订管理</div>
    <div class="spacer"></div>
    <button class="icon-btn" id="refresh">刷新</button>
    <button class="icon-btn" id="logout">退出</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="nToday">0</div><div class="t">今日订单</div></div>
    <div class="stat pending"><div class="n" id="nPending">0</div><div class="t">待确认</div></div>
    <div class="stat confirmed"><div class="n" id="nConfirmed">0</div><div class="t">已确认</div></div>
    <div class="stat cancelled"><div class="n" id="nCancelled">0</div><div class="t">已取消</div></div>
  </div>

  <div class="filters" id="filters">
    <button class="chip on" data-f="upcoming">待服务</button>
    <button class="chip" data-f="today">今天</button>
    <button class="chip" data-f="pending">待确认</button>
    <button class="chip" data-f="cancelled">已取消</button>
    <button class="chip" data-f="all">全部</button>
  </div>

  <div id="list"><div class="loading">加载中…</div></div>
  <div class="foot">桥水汀 · 一席山水，等你归来</div>
</div>

<script>
const API = 'https://wkfplrhiigsdfnmylgov.supabase.co/functions/v1/admin-manage';
const STATUS_TXT = { pending: '待确认', confirmed: '已确认', seated: '已到店', no_show: '未到', cancelled: '已取消' };
const DAYPART = { lunch: '午市', dinner: '晚市' };
const TIER = { small: '小包厢', large: '大包厢' };

let passcode = sessionStorage.getItem('qst_admin_pass') || '';
let all = [];
let filter = 'upcoming';

const $ = (id) => document.getElementById(id);

async function call(action, extra = {}) {
  const resp = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ passcode, action, ...extra })
  });
  if (resp.status === 401) throw new Error('unauthorized');
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
  return data;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function enter() {
  $('login').style.display = 'none';
  $('dash').style.display = 'block';
  load();
}

async function load() {
  $('list').innerHTML = '<div class="loading">加载中…</div>';
  try {
    const data = await call('list');
    all = data.reservations || [];
    renderStats();
    renderList();
  } catch (e) {
    if (e.message === 'unauthorized') return logout('口令已失效，请重新登录');
    $('list').innerHTML = '<div class="empty">加载失败，请点右上角刷新重试</div>';
  }
}

function renderStats() {
  const t = todayStr();
  $('nToday').textContent = all.filter(r => r.reserve_date === t && r.status !== 'cancelled').length;
  $('nPending').textContent = all.filter(r => r.status === 'pending').length;
  $('nConfirmed').textContent = all.filter(r => r.status === 'confirmed').length;
  $('nCancelled').textContent = all.filter(r => r.status === 'cancelled').length;
}

function visible() {
  const t = todayStr();
  switch (filter) {
    case 'today': return all.filter(r => r.reserve_date === t);
    case 'pending': return all.filter(r => r.status === 'pending');
    case 'cancelled': return all.filter(r => r.status === 'cancelled');
    case 'upcoming': return all.filter(r => r.reserve_date >= t && (r.status === 'pending' || r.status === 'confirmed'));
    default: return all;
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderList() {
  const rows = visible();
  if (!rows.length) { $('list').innerHTML = '<div class="empty">暂无订单</div>'; return; }
  let html = '';
  let lastDay = '';
  for (const r of rows) {
    if (r.reserve_date !== lastDay) {
      lastDay = r.reserve_date;
      html += `<div class="day-group">${esc(r.reserve_date)}${r.reserve_date === todayStr() ? ' · 今天' : ''}</div>`;
    }
    const room = esc(r.room_name || TIER[r.room_tier] || r.room_tier);
    const dim = (r.status === 'cancelled' || r.status === 'no_show') ? ' dim' : '';
    html += `<div class="card${dim}">
      <div class="row1">
        <span class="code">${esc(r.code)}</span>
        ${r.has_ktv ? '<span class="st confirmed">KTV</span>' : ''}
        <span class="st ${esc(r.status)}">${STATUS_TXT[r.status] || esc(r.status)}</span>
      </div>
      <div class="meta">
        ${DAYPART[r.daypart] || ''} ${esc(r.reserve_time)} · ${r.guests}人 · ${room}<br/>
        <span class="who">${esc(r.contact_name)}</span>　<a href="tel:${esc(r.contact_phone)}">${esc(r.contact_phone)}</a>
      </div>
      ${r.note ? `<div class="note">备注：${esc(r.note)}</div>` : ''}
      ${actions(r)}
    </div>`;
  }
  $('list').innerHTML = html;
}

function actions(r) {
  let btns = [];
  if (r.status === 'pending') {
    btns = [
      `<button class="act primary" onclick="setStatus('${r.id}','confirmed',this)">确认</button>`,
      `<button class="act danger" onclick="setStatus('${r.id}','cancelled',this,true)">取消</button>`
    ];
  } else if (r.status === 'confirmed') {
    btns = [
      `<button class="act primary" onclick="setStatus('${r.id}','seated',this)">已到店</button>`,
      `<button class="act" onclick="setStatus('${r.id}','no_show',this,true)">未到</button>`,
      `<button class="act danger" onclick="setStatus('${r.id}','cancelled',this,true)">取消</button>`
    ];
  } else if (r.status === 'cancelled' || r.status === 'no_show') {
    btns = [`<button class="act" onclick="setStatus('${r.id}','pending',this)">恢复待确认</button>`];
  } else {
    return '';
  }
  return `<div class="actions">${btns.join('')}</div>`;
}

async function setStatus(id, to, btn, danger) {
  const txt = { confirmed: '确认该订单？', cancelled: '确定取消该订单？顾客端不会收到通知，建议电话告知。', no_show: '标记为未到？' }[to];
  if (danger && !confirm(txt || '确定操作？')) return;
  btn.disabled = true;
  try {
    await call('update_status', { id, to });
    await load();
  } catch (e) {
    btn.disabled = false;
    alert('操作失败：' + e.message);
  }
}

function logout(msg) {
  sessionStorage.removeItem('qst_admin_pass');
  passcode = '';
  $('dash').style.display = 'none';
  $('login').style.display = 'flex';
  if (msg) $('loginErr').textContent = msg;
}

$('enter').addEventListener('click', async () => {
  passcode = $('pass').value.trim();
  if (!passcode) { $('loginErr').textContent = '请输入口令'; return; }
  $('loginErr').textContent = '';
  $('enter').disabled = true;
  try {
    await call('list', { status: 'pending' });
    sessionStorage.setItem('qst_admin_pass', passcode);
    enter();
  } catch (e) {
    $('loginErr').textContent = e.message === 'unauthorized' ? '口令不正确' : '网络异常，请重试';
  } finally {
    $('enter').disabled = false;
  }
});
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('enter').click(); });
$('refresh').addEventListener('click', load);
$('logout').addEventListener('click', () => logout());
$('filters').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  renderList();
});

if (passcode) enter();
</script>
</body>
</html>
